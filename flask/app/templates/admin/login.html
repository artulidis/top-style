<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Login - TopStyle by Kate Noda</title>        
        <link rel="icon" href="../static/assets/icons/TopStyleLogo.ico" type="image/x-icon" />

        <link rel="stylesheet" href="../static/admin/login.css" />
    </head>

    <body>
       <div class="container">
            <img src="../../static/assets/TopStyleLogo.png" />
            <form method="POST" action="/login">
                <div>
                    <div class="vertical-container">
                        <input type="username" name="username" placeholder="Username:" autofocus="">
                        <input type="password" name="password" placeholder="Password:">
                    
                        <div class="horizontal-container">
                            <button>Login</button>
                            <label>
                                Remember Me
                                <input type="checkbox" name="remember">
                            </label>
                        </div>
                    </div>
                    
                    
                </div>
            </form>
        </div> 
    </body>
</html>
