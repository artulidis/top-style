services:
  flask:
    build: ./flask
    container_name: flask_app
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./flask/app/static/uploads:/app/app/static/uploads

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./flask/app/static/:/static/:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/deployer/topstyle/webroot:/var/www/html
    depends_on:
      - flask